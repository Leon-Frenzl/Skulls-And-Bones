name: Suite quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust formatter
        run: rustup component add rustfmt
      - name: Install locked npm dependencies
        run: npm run install:verify-deps
      - name: Verify suite
        run: npm run verify:suite
