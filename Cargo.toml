[workspace]
resolver = "2"
members = [
    "tools/sb",
    "tools/sb-code",
    "tools/sb-forge",
    "tools/sb-key",
    "tools/sb-mesh",
    "tools/sb-node",
    "tools/sb-proxy",
    "tools/sb-db",
    "tools/sb-dns",
    "tools/sb-core",
    "tools/sb-app-contract",
    "tools/sb-app-protocol",
    "tools/sb-drive",
    "tools/sb-auth",
    "tools/sb-ca",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
homepage = "https://skulls-and-bones.org"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
