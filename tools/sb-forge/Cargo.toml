[package]
name        = "sb-forge"
version     = "0.1.1"
edition     = "2021"
description = "S&B Forge — Pipeline Runner, Secret Manager & Deployment Tool"
authors     = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license     = "MIT"
readme      = "README.md"
homepage    = "https://skulls-and-bones.org"
keywords    = ["ci-cd", "secrets", "sovereign", "devops", "security"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sb-forge"
path = "src/main.rs"

[dependencies]
sb-core = { version = "0.2.0", path = "../sb-core" }

# CLI
clap       = { version = "4.5", features = ["derive"] }
colored    = "3.0"

# Async runtime
tokio      = { version = "1.43", features = ["full"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "0.8"

# Crypto
aes-gcm    = "0.10"
rand       = "0.8"
sha2       = "0.10"
base64     = "0.22"

# SSH Host Key lesen
ssh-key    = { version = "0.6", features = ["ed25519"] }

# age-encryption
age        = "0.10"

# Filesystem & OS
dirs       = "6.0"
chrono     = { version = "0.4", features = ["serde"] }
walkdir    = "2.5"

# TUI
ratatui    = "0.29"
crossterm  = "0.28"

# Pattern matching (Secret Scanner)
regex      = "1.10"
rpassword = "7.5.4"
which = "8.0.6"
clap_complete = "4.6.9"
tar = "0.4"
flate2 = "1.0"
