[package]
name = "sb-dns"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "S&B Sovereign DNS — System-wide .sbm Split-DNS Resolver & Mesh Router"

[[bin]]
name = "sb-dns"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ed25519-dalek = "2.1"
hickory-proto = { version = "0.24.4", default-features = false, features = ["tokio-runtime"] }
sha2 = "0.10"
sb-core = { path = "../sb-core" }
