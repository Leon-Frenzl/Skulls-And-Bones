[mesh]
name = "sb-code"
version = "0.1.0"
topic = "sbm:code:sb-code"
channel = "main"
description = "S&B Code — Sovereign Unified Code Engine: AST Scopes, Live Swarm & Merkle VCS"

[swarm]
replication_factor = 1
preferred_anchors = ["hostinger-node"]

[lifecycle]
pre_publish = "sb-forge run check"
post_subscribe = "cargo check"

[ignore]
exclude = [
  "target/",
  "*.tar.gz"
]

