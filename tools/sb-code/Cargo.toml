[package]
name = "sb-code"
version = "0.1.0"
edition = "2021"
description = "S&B Code — Sovereign Unified Code Engine: AST Scopes, Live Swarm & BLAKE3 Merkle VCS"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://skulls-and-bones.org"
keywords = ["vcs", "collaboration", "crdt", "ast", "sovereign"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sb-code"
path = "src/main.rs"

[dependencies]
atomicwrites = "0.4.4"
fd-lock = "4.0.4"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tokio = { version = "1.43", features = ["full"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
blake3 = "1.5"
notify = "6.1"
dirs = "6.0"
which = "7.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
toml = "0.8"
tar = "0.4"
flate2 = "1.0"
sb-app-contract = { path = "../sb-app-contract" }
sb-mesh = { path = "../sb-mesh" }
tree-sitter = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ed25519-dalek = { version = "2.1", features = ["std"] }
hex = "0.4"
base64 = "0.22"
rand = "0.8"

