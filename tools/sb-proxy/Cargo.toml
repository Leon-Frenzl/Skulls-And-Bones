[package]
name = "sb-proxy"
version = "0.1.0"
edition = "2021"
description = "S&B Proxy — Sovereign Pure-Rust Reverse-Proxy & Edge Gateway with Zero-Config TLS and Interactive TUI"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://skulls-and-bones.org"
keywords = ["reverse-proxy", "edge-gateway", "security", "sovereign", "tui"]
categories = ["network-programming", "command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "sb-proxy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server-auto", "tokio"] }
log = "0.4"
env_logger = "0.11"
mime_guess = "2.0"
ratatui = "0.29"
crossterm = "0.28"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
sb-code = { version = "0.1.0", path = "../sb-code" }
sb-core = { version = "0.2.0", path = "../sb-core" }
sb-ca = { version = "0.1.0", path = "../sb-ca" }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
uuid = { version = "1.10", features = ["v4"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["io"] }
rustls-pemfile = "2.2"
hostname = "0.4"
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tokio", "tls12", "webpki-roots"] }
flate2 = "1.0"
