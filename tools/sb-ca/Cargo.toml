[package]
name = "sb-ca"
version = "0.1.0"
edition = "2021"
description = "S&B Sovereign PKI & Certificate Authority Engine (OpenSSH RFC 4251 and X.509 RFC 5280 / TLS 1.3)"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://skulls-and-bones.org"
keywords = ["pki", "ca", "ssh", "x509", "tls", "sovereign"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "sb_ca"
path = "src/lib.rs"

[[bin]]
name = "sb-ca"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "std", "getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "6.0"
hex = "0.4"
base64 = "0.22"
sb-core = { version = "0.2.0", path = "../sb-core" }
x509-parser = "0.18"

[dev-dependencies]


