[package]
name = "sb-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "S&B Sovereign DB — Embedded Document-KV Store, MVCC, Native TTL, Secondary Indexes & Reactive Watch"

[[bin]]
name = "sb-db"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
colored = "3.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
sb-mesh = { path = "../sb-mesh" }
