[package]
name = "sb-cred-provider"
version = "0.1.0"
edition = "2021"
description = "Skulls & Bones Windows Credential Provider COM DLL (Bei Skulls & Bones anmelden)"
license = "MIT"

[lib]
name = "sb_cred_provider"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
] }
windows-core = "0.59"
