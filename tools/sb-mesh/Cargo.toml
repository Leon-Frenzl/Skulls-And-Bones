[package]
name = "sb-mesh"
version = "0.3.0"
edition = "2021"
description = "S&B Sovereign Mesh (sb-mesh) — experimental User-Space P2P Overlay with a custom research protocol"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://skulls-and-bones.org"
keywords = ["wireguard", "p2p", "mesh", "tui", "sovereign"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossterm = "0.28"
ratatui = "0.29"
dirs = "6.0"
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "rand_core"] }
zeroize = { version = "1.8", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
sb-core = { version = "0.2.0", path = "../sb-core" }
sb-dns = { version = "0.2.0", path = "../sb-dns" }
