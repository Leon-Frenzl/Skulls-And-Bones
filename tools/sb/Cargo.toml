[package]
name = "sb-cli"
version = "0.2.3"
edition = "2021"
description = "S&B Suite Master CLI — Unified Command Center for Skulls & Bones Sovereign Developer Tools"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://skulls-and-bones.org"
keywords = ["suite", "cli", "sovereign", "devops", "security"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
dirs = "6.0"
which = "7.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap_complete = "4.5"
ratatui = "0.29"
crossterm = "0.28"
toml = "0.8"
ed25519-dalek = "2.1"
flate2 = "1.0"
tar = "0.4"
zip = { version = "9.2", default-features = false, features = ["deflate"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sb-core = { version = "0.2.0", path = "../sb-core" }
sb-mesh = { version = "0.3.0", path = "../sb-mesh" }
sb-key = { version = "0.1.0", path = "../sb-key" }
sb-ca = { version = "0.1.0", path = "../sb-ca" }
zeroize = "1.8"
aes-gcm = "0.10"
argon2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
