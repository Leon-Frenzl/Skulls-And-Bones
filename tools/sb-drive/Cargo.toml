[package]
name = "sb-drive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "💀 S&B Sovereign Drive (sb-drive) — Peer-Shared Mesh Storage, NTFS ACLs & Ghost Launch Engine"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
sha2 = "0.10"
dirs = "6.0"
sb-core = { version = "0.2.0", path = "../sb-core" }
sb-mesh = { version = "0.3.0", path = "../sb-mesh" }
sb-app-protocol = { version = "0.2.0", path = "../sb-app-protocol" }
sb-app-contract = { path = "../sb-app-contract" }
sb-code = { version = "0.1.0", path = "../sb-code" }
base64 = "0.22"
which = "7.0"

[dev-dependencies]
ed25519-dalek = "2.1"
