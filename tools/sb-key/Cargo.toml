[package]
name = "sb-key"
version = "0.1.0"
edition = "2021"
description = "S&B Key — Sovereign Root Identity & Ephemeral RAM Lease Engine"
authors = ["Skulls & Bones Lab <dev@skulls-and-bones.org>"]
license = "MIT"
readme = "TODO.md"
homepage = "https://skulls-and-bones.org"
keywords = ["cryptography", "security", "ephemeral-lease", "identity", "sovereign"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "sb_key"
path = "src/lib.rs"

[[bin]]
name = "sb-key"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
crc32fast = "1.4"
hex = "0.4"
dirs = "6.0"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
base64 = "0.22"
sb-core = { version = "0.2.0", path = "../sb-core" }
