[package]
name = "sb-linux-auth"
version = "0.1.0"
edition = "2021"
description = "S&B Linux PAM + NSS module (pam_sb.so / libnss_sb.so) communicating with sb-node-agent over Unix socket"
license = "MIT"

[lib]
name = "sb_auth_linux"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
